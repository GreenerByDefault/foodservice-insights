[project]
name = "gbd-foodservice-insights"
version = "0.0.0"
description = "The AI analysis library: categorization, emissions, and report generation."
requires-python = ">=3.14"
dependencies = [
    "google-genai>=1.62,<2",
    "Levenshtein>=0.27,<1",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "openai>=2.15,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "PyYAML>=6,<7",
    "seaborn>=0.13,<1",
]

[dependency-groups]
dev = ["PyPDF2>=3.0,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling ships every non-Python file inside the package directory, so the packaged data
# files and prompts need no glob list for a new file extension to fall out of.
[tool.hatch.build.targets.wheel]
packages = ["gbd_foodservice_insights"]
