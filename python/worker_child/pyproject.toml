[project]
name = "worker-child"
version = "0.0.0"
description = "One analysis run, spawned as a child process by the TypeScript worker parent."
requires-python = ">=3.13"
dependencies = ["foodservice-insights"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_child"]

[tool.uv.sources]
foodservice-insights = { workspace = true }
