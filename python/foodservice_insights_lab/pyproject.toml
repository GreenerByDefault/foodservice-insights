[project]
name = "foodservice-insights-lab"
version = "0.0.0"
description = "Experiments against the analysis library. Ships nothing; nothing imports it."
requires-python = ">=3.13"
dependencies = ["foodservice-insights"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foodservice_insights_lab"]

[tool.uv.sources]
foodservice-insights = { workspace = true }
