<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Your email was changed</title>
  </head>
  <body
    style="margin:0;padding:24px;background:#f5f5f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#1c1917;"
  >
    <div style="max-width:560px;margin:0 auto;padding:32px;background:#ffffff;border-radius:8px;">
      <h1 style="margin:0 0 16px;font-size:20px;">Your email was changed</h1>
      <p>Your PLATE account's email changed from {{ .OldEmail }} to {{ .Email }}.</p>
      <p>If you made this change, there is nothing to do. If you didn't, reply to this email.</p>
      <p style="margin:24px 0 0;color:#57534e;font-size:14px;">— PLATE (Greener by Default)</p>
    </div>
  </body>
</html>
