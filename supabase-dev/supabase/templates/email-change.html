<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Confirm your new email</title>
  </head>
  <body
    style="margin:0;padding:24px;background:#f5f5f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#1c1917;"
  >
    <div style="max-width:560px;margin:0 auto;padding:32px;background:#ffffff;border-radius:8px;">
      <h1 style="margin:0 0 16px;font-size:20px;">Confirm your new email</h1>
      <p>Enter this code to change your Foodservice Insights email to {{ .NewEmail }}:</p>
      <p style="margin:16px 0;font-size:32px;font-weight:600;letter-spacing:6px;">{{ .Token }}</p>
      <p>
        It works once and expires soon. If you did not ask to change your email, you can ignore this
        email; your account keeps {{ .Email }}.
      </p>
      <p style="margin:24px 0 0;color:#57534e;font-size:14px;">— Foodservice Insights</p>
    </div>
  </body>
</html>
