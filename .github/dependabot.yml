version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      vitest:
        patterns:
          - "vitest*"
          - "@vitest/*"
      playwright:
        patterns:
          - "playwright*"
          - "@playwright/*"
      svelte:
        patterns:
          - "svelte*"
          - "@sveltejs/*"
      database:
        patterns:
          - "kysely"
          - "kanel*"
          - "pg"
          - "@types/pg"
      # Group other non-major deps to cut down on PR noise.
      dev-dependencies:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    # "/" alone covers only .github/workflows, not the composite actions they call.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
