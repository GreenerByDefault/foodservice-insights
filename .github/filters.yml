# Which CI jobs a change can affect. Consumed by `dorny/paths-filter` in `workflows/ci.yml`
# with `predicate-quantifier: every`, so a file belongs to a filter only when it matches
# *all* of that filter's patterns — hence `'**'` plus exclusions, rather than an inclusion
# list. Only add an exclusion you can defend out loud.
#
# `scripts/ci/check_filters.py` enforces that every exclusion still matches a tracked file
# (or is marked `# planned` and matches none). `push: main` runs everything unfiltered as a
# second backstop.

# TypeScript never imports Python. (We use `system` for e2e tests.)
ts:
  - '**'
  - '!python/**'
  - '!pyproject.toml'
  - '!uv.lock'
  - '!Justfile'
  - '!.python-version'
  - '!.claude/**'
  - '!*.md'
  - '!**/README.md'
  - '!LICENSE'

# `foodservice_insights` and `worker_child`. Python imports no TypeScript, and no Python in
# the product imports the lab.
python:
  - '**'
  - '!apps/**'
  - '!packages/**'
  - '!tests/e2e/**'
  - '!supabase-dev/**'
  - '!supabase-test/**'
  - '!scripts/supabase'
  - '!.env.example'
  - '!.env.test'
  - '!python/foodservice_insights_lab/**'
  - '!package.json'
  - '!pnpm-lock.yaml'
  - '!pnpm-workspace.yaml'
  - '!tsconfig.base.json'
  - '!turbo.json'
  - '!biome.json'
  - '!.nvmrc'
  - '!.claude/**'
  - '!*.md'
  - '!**/README.md'
  - '!LICENSE'

# foodservice_insights_lab depends on foodservice_insights, so a core change reaches it;
# nothing depends on the lab, so it reaches nothing else. Same as `python` minus the lab
# exclusion.
python_lab:
  - '**'
  - '!apps/**'
  - '!packages/**'
  - '!tests/e2e/**'
  - '!supabase-dev/**'
  - '!supabase-test/**'
  - '!scripts/supabase'
  - '!.env.example'
  - '!.env.test'
  - '!package.json'
  - '!pnpm-lock.yaml'
  - '!pnpm-workspace.yaml'
  - '!tsconfig.base.json'
  - '!turbo.json'
  - '!biome.json'
  - '!.nvmrc'
  - '!.claude/**'
  - '!*.md'
  - '!**/README.md'
  - '!LICENSE'

# Whole-stack e2e depends on nearly everything; the lab is the one real
# exclusion, since nothing imports it and it's not in the worker image.
system:
  - '**'
  - '!python/foodservice_insights_lab/**'
  - '!.claude/**'
  - '!*.md'
  - '!**/README.md'
  - '!LICENSE'
