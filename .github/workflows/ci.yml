name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read  # paths-filter reads a PR's changed files via the API

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  TURBO_SCOPE: ${{ github.event_name == 'pull_request' && '--affected' || '--filter=*' }}
  # actions/checkout leaves the base branch as a remote-tracking ref only. Without this,
  # turbo can't resolve the branch and assumes every file changed.
  TURBO_SCM_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ts: ${{ steps.affected.outputs.ts }}
      python: ${{ steps.affected.outputs.python }}
      python_lab: ${{ steps.affected.outputs.python_lab }}
      system: ${{ steps.affected.outputs.system }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that every filter exclusion still describes reality
        run: python3 scripts/ci/check_filters.py

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/filters.yml
          # 'some' (the default) would make every filter true, since '**' always matches.
          predicate-quantifier: every

      - name: Resolve which areas to run
        id: affected
        env:
          UNFILTERED: ${{ github.event_name != 'pull_request' }}
          TS: ${{ steps.filter.outputs.ts }}
          PYTHON: ${{ steps.filter.outputs.python }}
          PYTHON_LAB: ${{ steps.filter.outputs.python_lab }}
          SYSTEM: ${{ steps.filter.outputs.system }}
        run: |
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          # area <name> <filter-result> [file the area's workspace must have]
          #
          # TODO: once python/ and tests/e2e/ are permanent fixtures, the third argument's
          # existence check is always true. Drop it and the [ -f ] line, and call area with
          # just <name> <filter-result> everywhere.
          area() {
            if [ -n "${3:-}" ] && [ ! -f "$3" ]; then emit "$1" false; return; fi
            if [ "$UNFILTERED" = 'true' ] || [ "$2" = 'true' ]; then emit "$1" true; return; fi
            emit "$1" false
          }

          area ts "$TS"
          area python "$PYTHON" pyproject.toml
          area python_lab "$PYTHON_LAB" pyproject.toml
          area system "$SYSTEM" tests/e2e/package.json

  ts-static:
    name: 'TS: lint + typecheck'
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Turbo's --affected needs the base ref locally.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - run: pnpm lint
      - run: pnpm exec turbo run check "$TURBO_SCOPE"

  ts-unit:
    name: 'TS: unit + component tests'
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # see ts-static
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/playwright-browsers
      - uses: ./.github/actions/setup-supabase
      - run: pnpm exec turbo run test:unit "$TURBO_SCOPE"

  ts-db-types:
    name: 'TS: generated DB types are current'
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-supabase
      - run: pnpm migrate
        env:
          TEST_DB: '1'
      - name: Regenerate types and check nothing changed
        env:
          TEST_DB: '1'
        run: |
          pnpm db:gen-types
          if ! git diff --exit-code --quiet packages/db/src/generated; then
            echo '::error::packages/db/src/generated is stale. Run `pnpm migrate && pnpm db:gen-types` and commit the result.'
            git diff packages/db/src/generated
            exit 1
          fi

  ts-e2e:
    name: 'TS: e2e tests'
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # see ts-static
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/playwright-browsers
      - uses: ./.github/actions/setup-supabase
      - run: pnpm exec turbo run test:e2e "$TURBO_SCOPE"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  py-static:
    name: 'Python: lint + typecheck'
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  py-unit:
    name: 'Python: unit tests'
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - run: uv run pytest python/catering_analysis python/worker_child

  py-lab:
    name: 'Python: lab tests'
    needs: changes
    if: needs.changes.outputs.python_lab == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - run: uv run pytest python/catering_analysis_lab

  system-e2e:
    name: 'System e2e tests'
    needs: changes
    if: needs.changes.outputs.system == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/playwright-browsers
      - run: pnpm exec turbo run test:system

  # Stable name to point branch protection at, independent of the jobs above.
  # Must stay always(): most jobs are skipped on most runs, and skipped isn't a failure.
  ci:
    name: CI
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      [changes, ts-static, ts-unit, ts-db-types, ts-e2e, py-static, py-unit, py-lab, system-e2e]
    steps:
      - name: Verify every job succeeded
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "One or more jobs failed."
            exit 1
          fi
