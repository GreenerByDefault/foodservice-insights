name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read  # paths-filter reads a PR's changed files via the API

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  TURBO_SCOPE: ${{ github.event_name == 'pull_request' && '--affected' || '--filter=*' }}
  # actions/checkout leaves the base branch as a remote-tracking ref only. Without this,
  # turbo can't resolve the branch and assumes every file changed.
  TURBO_SCM_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ts: ${{ steps.affected.outputs.ts }}
      python: ${{ steps.affected.outputs.python }}
      python_lab: ${{ steps.affected.outputs.python_lab }}
      system: ${{ steps.affected.outputs.system }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that every filter exclusion still describes reality
        run: python3 scripts/ci/check_filters.py

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/filters.yml
          # 'some' (the default) would make every filter true, since '**' always matches.
          predicate-quantifier: every

      - name: Resolve which areas to run
        id: affected
        env:
          UNFILTERED: ${{ github.event_name != 'pull_request' }}
          TS: ${{ steps.filter.outputs.ts }}
          PYTHON: ${{ steps.filter.outputs.python }}
          PYTHON_LAB: ${{ steps.filter.outputs.python_lab }}
          SYSTEM: ${{ steps.filter.outputs.system }}
        run: |
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          # area <name> <filter-result> [file the area's workspace must have]
          #
          # TODO: once tests/e2e/ is a permanent fixture, the third argument's existence
          # check is always true. Drop it and the [ -f ] line, and call area with just
          # <name> <filter-result> everywhere.
          area() {
            if [ -n "${3:-}" ] && [ ! -f "$3" ]; then emit "$1" false; return; fi
            if [ "$UNFILTERED" = 'true' ] || [ "$2" = 'true' ]; then emit "$1" true; return; fi
            emit "$1" false
          }

          area ts "$TS"
          area python "$PYTHON"
          area python_lab "$PYTHON_LAB"
          area system "$SYSTEM" tests/e2e/package.json

  ts-static:
    name: 'TS: lint + typecheck'
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Turbo's --affected needs the base ref locally.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - run: pnpm lint
      - run: pnpm exec turbo run check "$TURBO_SCOPE"

  ts-unit:
    name: 'TS: unit + component tests'
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # see ts-static
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/playwright-browsers
      - uses: ./.github/actions/setup-supabase
      - run: pnpm exec turbo run test:unit "$TURBO_SCOPE"

  ts-db-types:
    name: 'TS: generated DB types are current'
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-supabase
      - run: pnpm migrate
        env:
          TEST_DB: '1'
      - name: Regenerate types and schema dump, and check nothing changed
        env:
          TEST_DB: '1'
        run: |
          pnpm db:gen-types
          if ! git diff --exit-code --quiet packages/db/src/generated packages/db/schema.sql packages/db/auth-schema.sql; then
            echo '::error::packages/db/src/generated, packages/db/schema.sql, or packages/db/auth-schema.sql is stale. Run `pnpm migrate && pnpm db:gen-types` and commit the result.'
            echo '::notice::If you ran that locally and still see a diff, your local Supabase CLI version probably differs from the one pinned in .github/actions/setup-supabase/action.yml. Run `brew upgrade supabase`, then bump the pinned `version:` in that file to match `supabase --version`, and regenerate. auth-schema.sql is especially sensitive to this: its contents come from the GoTrue version the pinned CLI ships, not from our own migrations.'
            git diff packages/db/src/generated packages/db/schema.sql packages/db/auth-schema.sql
            exit 1
          fi

  ts-e2e:
    name: 'TS: e2e tests'
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # see ts-static
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/playwright-browsers
      - uses: ./.github/actions/setup-supabase
      - run: pnpm exec turbo run test:e2e "$TURBO_SCOPE"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Split from ts-e2e, and on a different runner, because every screenshot is captured through a
  # browser pinned to `linux/arm64` (see apps/web/e2e/setup/browser-container.ts). Running the job on
  # arm means that browser runs natively rather than under emulation. ts-e2e stays on x86 because
  # it exercises server behaviour and x86 is what production runs.
  #
  # No playwright-browsers step: the container brings its own Chromium, and this job's project
  # never launches a host one.
  ts-screenshots:
    name: 'TS: screenshot snapshots'
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # see ts-static
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-supabase
      - run: pnpm exec turbo run test:screenshots "$TURBO_SCOPE"

      # `screenshots:update` requires oxipng. To upgrade to a new version, go to
      # https://github.com/oxipng/oxipng/releases to get the latest version and the corresponding
      # sha256 checksum for the `aarch64-unknown-linux-gnu` artifact.
      - name: Install oxipng
        if: failure()
        run: |
          version=10.2.0
          asset=oxipng-$version-aarch64-unknown-linux-gnu.tar.gz
          sha256=97d168c6c0d1dbcb36e7438eb489804748a2ba40d94fe21aa7dab7372e9efe9b

          workdir=$(mktemp -d)
          curl -fsSL -o "$workdir/$asset" "https://github.com/oxipng/oxipng/releases/download/v$version/$asset"
          echo "$sha256  $workdir/$asset" | sha256sum -c -

          tar -xzf "$workdir/$asset" -C "$workdir"
          install -m 755 "$workdir/oxipng-$version-aarch64-unknown-linux-gnu/oxipng" /usr/local/bin/oxipng
          oxipng --version

      # Regenerating on failure makes the artifact a drop-in replacement for the committed
      # directory, which is the whole recovery path for a fork contributor: red check, download,
      # commit. `updateSnapshots: 'none'` keeps the run above from doing this silently.
      - name: Regenerate the snapshots so they can be downloaded
        if: failure()
        run: |
          msg='Screenshots differ from the committed images. If the change was intended, run '
          msg+='`pnpm --filter @gbd/web run screenshots:update` and commit '
          msg+='apps/web/e2e/__screenshots__ — or download the `screenshots` artifact from this '
          msg+='run and commit that.'
          echo "::notice::$msg"
          pnpm --filter @gbd/web run screenshots:update
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: apps/web/e2e/__screenshots__/
          retention-days: 7
          if-no-files-found: ignore

  py-static:
    name: 'Python: lint + typecheck'
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - run: just lint
      - run: just check

  py-unit:
    name: 'Python: unit tests'
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - run: just test

  py-lab:
    name: 'Python: lab tests'
    needs: changes
    if: needs.changes.outputs.python_lab == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - run: just test-lab

  system-e2e:
    name: 'System e2e tests'
    needs: changes
    if: needs.changes.outputs.system == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/playwright-browsers
      - run: pnpm exec turbo run test:system

  # Stable name to point branch protection at, independent of the jobs above.
  # Must stay always(): most jobs are skipped on most runs, and skipped isn't a failure.
  ci:
    name: CI
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        ts-static,
        ts-unit,
        ts-db-types,
        ts-e2e,
        ts-screenshots,
        py-static,
        py-unit,
        py-lab,
        system-e2e,
      ]
    steps:
      - name: Verify every job succeeded
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "One or more jobs failed."
            exit 1
          fi
