name: CI

on:
  pull_request:
  # Also run on main. GitHub Actions caches written on a feature branch are not
  # readable from other branches, so without main runs PRs never get cache hits.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  # Never cancel main runs -- they are what warm the caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  static:
    name: lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Deliberately not a Turborepo task: Biome is one fast Rust process over the
      # whole repo, and `biome ci` emits GitHub annotations automatically.
      - run: pnpm exec biome ci .
      - run: pnpm run check

  unit:
    name: unit + component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Component tests render in real Chromium, so they need the browser too.
      - uses: ./.github/actions/playwright-browsers
      - run: pnpm run test:unit

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright-browsers
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # One stable check name to point branch protection at, so adding jobs above
  # never requires touching repository settings.
  ci:
    name: CI
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [static, unit, e2e]
    steps:
      - name: Verify every job succeeded
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "One or more jobs failed."
            exit 1
          fi
