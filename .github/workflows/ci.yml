name: CI

on:
  pull_request:
  # Pull requests only run the jobs that a change can affect. Pushes to main run everything,
  # unfiltered, so a wrong exclusion in `filters.yml` surfaces within one squash-merge
  # instead of hiding indefinitely.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists a PR's changed files through the API

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  # Which packages every turbo task covers. On a pull request, the ones it affects —
  # Turborepo derives the package graph from each `package.json`, so this includes transitive
  # dependents without a hand-maintained list, and falls back to *every* package if a root
  # file changed or the clone is too shallow to compare. On main, every package, spelled as a
  # filter rather than as an empty string so the value is always a single quotable argument.
  TURBO_SCOPE: ${{ github.event_name == 'pull_request' && '--affected' || '--filter=*' }}

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ts: ${{ steps.affected.outputs.ts }}
      python: ${{ steps.affected.outputs.python }}
      python_lab: ${{ steps.affected.outputs.python_lab }}
      system: ${{ steps.affected.outputs.system }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that every filter exclusion still describes reality
        run: python3 scripts/ci/check_filters.py

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/filters.yml
          # Every pattern must match, which is what makes `'**'` plus negations mean
          # "anything not excluded below". The default, `some`, would make every filter
          # unconditionally true because of the leading `'**'`.
          predicate-quantifier: every

      - name: Resolve which areas to run
        id: affected
        # Two things are combined here so that each job's `if:` stays a single comparison:
        #
        #   - On anything other than a pull request, every area runs.
        #   - The Python and system suites additionally require their workspace to exist.
        #     The filters fail safe, so `python` and `system` already fire on, say, a
        #     `.github/` change, and those jobs would fail rather than skip before
        #     `pyproject.toml` and `tests/e2e/` land. This is a fact about the commit, not a
        #     guess about dependencies, so the closed-world property still holds.
        env:
          UNFILTERED: ${{ github.event_name != 'pull_request' }}
          TS: ${{ steps.filter.outputs.ts }}
          PYTHON: ${{ steps.filter.outputs.python }}
          PYTHON_LAB: ${{ steps.filter.outputs.python_lab }}
          SYSTEM: ${{ steps.filter.outputs.system }}
        run: |
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          # area <name> <filter-result> [file the suite needs in order to exist at all]
          area() {
            if [ -n "${3:-}" ] && [ ! -f "$3" ]; then emit "$1" false; return; fi
            if [ "$UNFILTERED" = 'true' ] || [ "$2" = 'true' ]; then emit "$1" true; return; fi
            emit "$1" false
          }

          area ts "$TS"
          area python "$PYTHON" pyproject.toml
          area python_lab "$PYTHON_LAB" pyproject.toml
          area system "$SYSTEM" tests/e2e/package.json

  ts-static:
    name: 'TS: lint + typecheck'
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `--affected` needs the base ref present locally. With a shallow clone Turborepo
      # treats every package as affected, so shortening this silently gives up the filtering
      # rather than failing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - run: pnpm lint
      - run: pnpm exec turbo run check "$TURBO_SCOPE"

  ts-unit:
    name: 'TS: unit + component tests'
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # see ts-static
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/playwright-browsers
      - run: pnpm exec turbo run test:unit "$TURBO_SCOPE"

  ts-e2e:
    name: 'TS: e2e tests'
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # see ts-static
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/playwright-browsers
      - run: pnpm exec turbo run test:e2e "$TURBO_SCOPE"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  py-static:
    name: 'Python: lint + typecheck'
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # **Open:** no Python type checker chosen yet — ty, mypy, or pyright.

  py-unit:
    name: 'Python: unit tests'
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - run: uv run pytest python/catering_analysis python/worker_child

  py-lab:
    name: 'Python: lab tests'
    needs: changes
    if: needs.changes.outputs.python_lab == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - run: uv run pytest python/catering_analysis_lab

  system-e2e:
    name: 'System e2e tests'
    needs: changes
    if: needs.changes.outputs.system == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-uv
      - uses: ./.github/actions/playwright-browsers
      # A task name of its own, not `test:e2e`, so that ts-e2e stays the web app's own
      # e2e suite and this stays the whole-stack one. No `$TURBO_SCOPE`: this suite depends
      # on every component, and the `system` filter has already decided that.
      - run: pnpm exec turbo run test:system

  # Stable name to point branch protection at, independent of the jobs above. It must stay
  # `always()`: with path filtering, most jobs are skipped on most runs, and this is the only
  # check that always reports. Skipped is not a failure.
  ci:
    name: CI
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [changes, ts-static, ts-unit, ts-e2e, py-static, py-unit, py-lab, system-e2e]
    steps:
      - name: Verify every job succeeded
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "One or more jobs failed."
            exit 1
          fi
