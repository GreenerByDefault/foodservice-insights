name: Deploy

# Every push to main builds *both* images, whichever service ends up deploying. One image per
# commit is what makes a deploy a promotion and a rollback a redeploy of bytes that already ran
# (`.claude/plans/deploy-image-registry.md`); a commit that only ever built one of the two is a
# commit the other service can never be rolled back to.
#
# Web deploys on every push to main because it runs the database migrations, which the worker
# may later need.
#
# The worker only ever deploys via workflow_dispatch, naming a SHA. This is because deploying
# the worker risks killing in-flight requests, per ARCHITECTURE.md § Deployments.
#
# We also use workflow_dispatch for rollbacks of either service: dispatch it again naming an
# older SHA.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        type: choice
        options: [web, worker]
        required: true
      sha:
        description: Commit SHA to deploy (defaults to the branch tip)
        type: string
        required: false
      force_rebuild:
        description: Rebuild the chosen service's image even if this commit already has one
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  # Two jobs rather than a matrix over [web, worker]: `needs:` has no per-leg granularity, so a
  # matrix would make every web deploy — the path that runs migrations — wait on the slower
  # Node+Python worker build, and a worker build failure would block it outright.
  #
  # On a dispatch these build only the service being deployed. force_rebuild is the one thing in
  # this workflow that deliberately moves an existing tag, so it moves exactly the one the
  # operator asked to redeploy.
  build-web:
    name: Build web image
    if: >-
      github.event_name == 'push'
      || (inputs.force_rebuild == true && inputs.service == 'web')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-web-${{ inputs.sha || github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read # a job-level block replaces the workflow-level one, so restate this
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: ./.github/actions/build-image
        with:
          service: web
          sha: ${{ inputs.sha || github.sha }}
          force_rebuild: ${{ inputs.force_rebuild }}

  build-worker:
    name: Build worker image
    if: >-
      github.event_name == 'push'
      || (inputs.force_rebuild == true && inputs.service == 'worker')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-worker-${{ inputs.sha || github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: ./.github/actions/build-image
        with:
          service: worker
          sha: ${{ inputs.sha || github.sha }}
          force_rebuild: ${{ inputs.force_rebuild }}

  # Both deploy jobs name a status function rather than a plain boolean `if:`. A plain one is
  # implicitly ANDed with success() over `needs`, so a dispatch that skips the build would skip
  # the deploy with it. It must be !cancelled() and not always(), which would deploy straight
  # through an operator hitting Cancel.
  deploy-web:
    name: Deploy web
    needs: build-web
    if: >-
      !cancelled() && needs.build-web.result != 'failure' && needs.build-web.result != 'cancelled'
      && (github.event_name == 'push' || inputs.service == 'web')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Serializes same-service deploys; a web push and a worker dispatch never contend.
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: ./.github/actions/deploy-service
        with:
          service: web
          sha: ${{ inputs.sha || github.sha }}

  deploy-worker:
    name: Deploy worker
    needs: build-worker
    if: >-
      !cancelled() && needs.build-worker.result != 'failure'
      && needs.build-worker.result != 'cancelled'
      && github.event_name == 'workflow_dispatch' && inputs.service == 'worker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    permissions:
      contents: write # to move the deploy/worker tag on success
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0 # need full history and tags for the delta below, and to move the tag

      - name: Show commits since the last worker deploy
        run: |
          if git rev-parse -q --verify refs/tags/deploy/worker >/dev/null; then
            git log deploy/worker..HEAD --oneline
          else
            echo 'No deploy/worker tag yet — this is the first tracked worker deploy.'
          fi

      - uses: ./.github/actions/deploy-service
        with:
          service: worker
          sha: ${{ inputs.sha || github.sha }}

      - name: Move the deploy/worker tag
        run: |
          git tag -f deploy/worker HEAD
          git push -f origin deploy/worker
