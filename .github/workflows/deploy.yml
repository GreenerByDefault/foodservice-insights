name: Deploy

# Every push to main builds *both* images, whichever service ends up deploying. One image per
# commit is what allows a deploy to simply point at a commit SHA to move the pointer to the
# pre-built image.
#
# Deploying on push needs no wait for CI: main only moves through the merge queue, which ran the
# full suite on the very commit that lands, so every image built here is of a tested commit.
#
# Web deploys on every push to main because it runs the database migrations, which the worker
# may later need.
#
# The worker only ever deploys via workflow_dispatch from main, at the commit the web runs. This is
# because deploying the worker risks killing in-flight requests, per ARCHITECTURE.md § Deployments.
#
# Nothing here rolls back: a bad deploy is reverted and deploys forward like any other change, per
# ARCHITECTURE.md § Bad deploys are fixed forward.
#
# Production secrets live only in the `production` Environment, never as repo secrets, which any
# pull_request run from a same-repo branch can read by editing a workflow. The Environment only
# deploys from main, so a dispatch of another branch's copy of this file — which may have dropped
# its `environment:` lines and every check below — runs without credentials.
#
# Every third-party action on the deploy path, including inside the composite actions these jobs
# call, is pinned by commit SHA: the build jobs push the image prod runs, and the deploy jobs
# hold prod credentials. Dependabot keeps the pins current.
on:
  push:
    branches: [main]
  workflow_dispatch: # deploys the worker

permissions:
  contents: read

jobs:
  build-web:
    name: Build web image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-web-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-image
        with:
          service: web
          sha: ${{ github.sha }}

  build-worker:
    name: Build worker image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-worker-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-image
        with:
          service: worker
          sha: ${{ github.sha }}

  deploy-web:
    name: Deploy web
    needs: build-web
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    permissions:
      contents: write # to move the deploy/web tag on success
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for the supersession check below, and to move the tag

      # Build time varies, so runs can finish out of push order: push A (a slow base-layer change)
      # can finish after push B (a fast cache hit) has already deployed, which would roll prod
      # *backwards*. Skip a run once main has moved past its SHA. The same check makes re-running
      # an old failed run safe.
      #
      # This check must sit above the migrate step deploy-migrations.md will add, so a
      # superseded run does nothing at all rather than migrating and then declining to deploy.
      - name: Skip if main has moved past this commit
        shell: bash
        run: |
          current_tip=$(git rev-parse origin/main)
          if [ "${{ github.sha }}" != "$current_tip" ]; then
            echo "::notice::Skipping: main has moved on to $(git rev-parse --short "$current_tip"), whose own deploy will ship instead."
            echo "superseded=true" >> "$GITHUB_ENV"
          fi

      - uses: ./.github/actions/deploy-service
        id: deploy
        if: env.superseded != 'true'
        with:
          service: web
          sha: ${{ github.sha }}

      # deploy-worker deploys the commit this tag names.
      - name: Move the deploy/web tag
        if: env.superseded != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a deploy/web "${{ github.sha }}" -m "digest: ${{ steps.deploy.outputs.digest }}"
          git push -f origin deploy/web

  deploy-worker:
    name: Deploy worker
    if: github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    permissions:
      contents: write # to move the deploy/worker tag on success
    steps:
      # The deploy tooling is the dispatched branch's copy. The Environment's branch rule already
      # refuses this job before any step runs; this says why in the log, and still catches the
      # mistake if that rule is ever loosened.
      - name: Refuse a dispatch from outside main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::The worker deploys from main only, not ${GITHUB_REF#refs/heads/}. Run the workflow again with 'Use workflow from' set to main."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history and tags for the steps below, and to move the tag

      # Not main's tip: the worker never runs ahead of the web, which applies the migrations it
      # needs, and main's tip may still be migrating or have failed to.
      - name: Resolve the commit the web runs
        id: target
        run: |
          if ! sha=$(git rev-parse -q --verify 'refs/tags/deploy/web^{commit}'); then
            echo "::error::The web has never deployed through this workflow, and the worker deploys only a commit the web runs. Wait for the next push to main to deploy the web."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying the worker at the commit the web runs: $(git log -1 --format='%h %s' "$sha")"

      - name: Show commits since the last worker deploy
        run: |
          if git rev-parse -q --verify refs/tags/deploy/worker >/dev/null; then
            git log "deploy/worker..${{ steps.target.outputs.sha }}" --oneline
          else
            echo 'No deploy/worker tag yet — this is the first tracked worker deploy.'
          fi

      - uses: ./.github/actions/deploy-service
        id: deploy
        with:
          service: worker
          sha: ${{ steps.target.outputs.sha }}

      - name: Move the deploy/worker tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a deploy/worker "${{ steps.target.outputs.sha }}" -m "digest: ${{ steps.deploy.outputs.digest }}"
          git push -f origin deploy/worker
