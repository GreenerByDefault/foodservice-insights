name: Deploy

# Every push to main builds *both* images, whichever service ends up deploying. One image per
# commit is what allows promotion and rollbacks to simply point at a commit SHA to move the
# pointer to the pre-built image.
#
# Web deploys on every push to main because it runs the database migrations, which the worker
# may later need.
#
# The worker only ever deploys via workflow_dispatch, naming a SHA. This is because deploying
# the worker risks killing in-flight requests, per ARCHITECTURE.md § Deployments.
#
# We also use workflow_dispatch for rollbacks of either service: dispatch it again naming an
# older commit SHA.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        type: choice
        options: [web, worker]
        required: true
      sha:
        description: Commit SHA to deploy (defaults to the branch tip)
        type: string
        required: false
      force_rebuild:
        description: Rebuild the chosen service's image even if this commit already has one
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-web:
    name: Build web image
    if: >-
      github.event_name == 'push'
      || (inputs.force_rebuild == true && inputs.service == 'web')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-web-${{ inputs.sha || github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Resolve full commit SHA
        id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-image
        with:
          service: web
          sha: ${{ steps.sha.outputs.sha }}
          force_rebuild: ${{ inputs.force_rebuild }}

  build-worker:
    name: Build worker image
    if: >-
      github.event_name == 'push'
      || (inputs.force_rebuild == true && inputs.service == 'worker')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-worker-${{ inputs.sha || github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Resolve full commit SHA
        id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-image
        with:
          service: worker
          sha: ${{ steps.sha.outputs.sha }}
          force_rebuild: ${{ inputs.force_rebuild }}

  deploy-web:
    name: Deploy web
    needs: build-web
    if: >-
      !cancelled() && needs.build-web.result != 'failure' && needs.build-web.result != 'cancelled'
      && (github.event_name == 'push' || inputs.service == 'web')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0 # need origin/main's current tip for the supersession check below

      - name: Resolve full commit SHA
        id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Build time varies, so runs can finish out of push order: push A (a slow base-layer change)
      # can finish after push B (a fast cache hit) has already deployed, which would roll prod
      # *backwards*. Skip a push run once main has moved
      # past its SHA.
      #
      # Push-only — a workflow_dispatch deliberately names a non-tip SHA for rollback and must
      # never be skipped.
      #
      # This check must sit above the migrate step deploy-migrations.md will add, so a
      # superseded run does nothing at all rather than migrating and then declining to deploy.
      - name: Skip if main has moved past this commit
        if: github.event_name == 'push'
        shell: bash
        run: |
          current_tip=$(git rev-parse origin/main)
          if [ "${{ steps.sha.outputs.sha }}" != "$current_tip" ]; then
            echo "::notice::main is now at $current_tip, past ${{ steps.sha.outputs.sha }} — a newer push will deploy instead. Skipping."
            echo "superseded=true" >> "$GITHUB_ENV"
          fi

      - uses: ./.github/actions/deploy-service
        if: env.superseded != 'true'
        with:
          service: web
          sha: ${{ steps.sha.outputs.sha }}

  deploy-worker:
    name: Deploy worker
    needs: build-worker
    if: >-
      !cancelled() && needs.build-worker.result != 'failure'
      && needs.build-worker.result != 'cancelled'
      && github.event_name == 'workflow_dispatch' && inputs.service == 'worker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    permissions:
      contents: write # to move the deploy/worker tag on success
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0 # need full history and tags for the delta below, and to move the tag

      - name: Resolve full commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Show commits since the last worker deploy
        run: |
          if git rev-parse -q --verify refs/tags/deploy/worker >/dev/null; then
            git log deploy/worker..HEAD --oneline
          else
            echo 'No deploy/worker tag yet — this is the first tracked worker deploy.'
          fi

      - uses: ./.github/actions/deploy-service
        id: deploy
        with:
          service: worker
          sha: ${{ steps.sha.outputs.sha }}

      - name: Move the deploy/worker tag
        run: |
          git tag -f -a deploy/worker HEAD -m "digest: ${{ steps.deploy.outputs.digest }}"
          git push -f origin deploy/worker
