name: Deploy

# Every push to main builds *both* images, whichever service ends up deploying. One image per
# commit is what allows a deploy to simply point at a commit SHA to move the pointer to the
# pre-built image.
#
# Web deploys on every push to main because it runs the database migrations, which the worker
# may later need.
#
# The worker only ever deploys via workflow_dispatch from main, at main's latest commit. This is
# because deploying the worker risks killing in-flight requests, per ARCHITECTURE.md § Deployments.
#
# Nothing here rolls back: a bad deploy is reverted and deploys forward like any other change, per
# ARCHITECTURE.md § Bad deploys are fixed forward.
#
# Whichever way it starts, a deploy ships only a commit on main (.github/actions/deploy-target).
on:
  push:
    branches: [main]
  workflow_dispatch: # deploys the worker

permissions:
  contents: read

jobs:
  build-web:
    name: Build web image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-web-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-image
        with:
          service: web
          sha: ${{ github.sha }}

  build-worker:
    name: Build worker image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-worker-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-image
        with:
          service: worker
          sha: ${{ github.sha }}

  deploy-web:
    name: Deploy web
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    permissions:
      contents: write # to move the deploy/web tag on success
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for the ancestry checks, and to move the tag

      - uses: ./.github/actions/deploy-target
        id: target

      # Build time varies, so runs can finish out of push order: push A (a slow base-layer change)
      # can finish after push B (a fast cache hit) has already deployed, which would roll prod
      # *backwards*. Skip a run once main has moved past its SHA. The same check makes re-running
      # an old failed run safe.
      #
      # This check must sit above the migrate step deploy-migrations.md will add, so a
      # superseded run does nothing at all rather than migrating and then declining to deploy.
      - name: Skip if main has moved past this commit
        shell: bash
        run: |
          current_tip=$(git rev-parse origin/main)
          if [ "${{ steps.target.outputs.sha }}" != "$current_tip" ]; then
            echo "::notice::Skipping: main has moved on to $(git rev-parse --short "$current_tip"), whose own deploy will ship instead."
            echo "superseded=true" >> "$GITHUB_ENV"
          fi

      - uses: ./.github/actions/deploy-service
        id: deploy
        if: env.superseded != 'true'
        with:
          service: web
          sha: ${{ steps.target.outputs.sha }}

      # deploy-worker refuses a commit that is not behind this tag.
      - name: Move the deploy/web tag
        if: env.superseded != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a deploy/web "${{ steps.target.outputs.sha }}" -m "digest: ${{ steps.deploy.outputs.digest }}"
          git push -f origin deploy/web

  deploy-worker:
    name: Deploy worker
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    permissions:
      contents: write # to move the deploy/worker tag on success
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history and tags for the checks below, and to move the tag

      - uses: ./.github/actions/deploy-target
        id: target

      # The worker runs behind the web, which runs the migrations it may need. A dispatch takes
      # main's tip, possibly while that push's deploy-web is still migrating, or after it failed.
      - name: Refuse a commit the web has not deployed
        run: |
          if ! git rev-parse -q --verify refs/tags/deploy/web >/dev/null; then
            echo "::error::The web has never deployed through this workflow, and the worker may only run a commit the web already runs. Wait for the next push to main to deploy the web."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${{ steps.target.outputs.sha }}" deploy/web; then
            echo "::error::The web runs $(git rev-parse --short deploy/web), older than $(git rev-parse --short "${{ steps.target.outputs.sha }}"). The worker may only run a commit the web already runs, since the web applies the migrations it needs. Wait for the web to deploy this commit (the push's Deploy web job), then run this workflow again."
            exit 1
          fi

      - name: Show commits since the last worker deploy
        run: |
          if git rev-parse -q --verify refs/tags/deploy/worker >/dev/null; then
            git log "deploy/worker..${{ steps.target.outputs.sha }}" --oneline
          else
            echo 'No deploy/worker tag yet — this is the first tracked worker deploy.'
          fi

      - uses: ./.github/actions/deploy-service
        id: deploy
        with:
          service: worker
          sha: ${{ steps.target.outputs.sha }}

      - name: Move the deploy/worker tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a deploy/worker "${{ steps.target.outputs.sha }}" -m "digest: ${{ steps.deploy.outputs.digest }}"
          git push -f origin deploy/worker
