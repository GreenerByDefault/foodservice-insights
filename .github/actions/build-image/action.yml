name: Build and push image
description: >
  Build one service's Docker image and push it to GHCR, tagged with the commit SHA.

inputs:
  service:
    description: Service to build (web or worker)
    required: true
  sha:
    description: Commit SHA to tag the image with
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/resolve-image-name
      id: image
      with:
        service: ${{ inputs.service }}

    - name: Compute cache image name
      id: cache
      shell: bash
      run: |
        # GHCR rejects an uppercase path, and ${{ github.repository }} is `GreenerByDefault/...`.
        repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "name=ghcr.io/$repo_lower/cache" >> "$GITHUB_OUTPUT"

    # Needed even to check whether the tag exists: the package starts private on first push, so
    # an anonymous `docker manifest inspect` 401s until someone flips it to public.
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # main only ever moves forward, so a tag that already exists means this exact commit was
    # already built, as on a re-run — rebuilding costs time and buys nothing. A bad image is fixed
    # forward like any other change, with a new commit.
    - name: Check whether this commit already has an image
      id: existing
      shell: bash
      run: |
        if docker manifest inspect "${{ steps.image.outputs.name }}:${{ inputs.sha }}" >/dev/null 2>&1; then
          echo "::notice::${{ inputs.service }}@${{ inputs.sha }} is already built — skipping."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      if: steps.existing.outputs.skip != 'true'

    # Never delete a commit-tagged version from the resulting package: the hosting provider's own
    # rollback redeploys an earlier one, and public GHCR packages have free storage, so there is no
    # cost pressure to prune them. Build cache lives in the separate `cache` package instead, which is the only one
    # ever safe to garbage-collect.
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      if: steps.existing.outputs.skip != 'true'
      with:
        context: .
        file: apps/${{ inputs.service }}/Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ steps.image.outputs.name }}:${{ inputs.sha }}
        # The web's Dockerfile declares no such ARG, so it ignores this.
        build-args: GIT_SHA=${{ inputs.sha }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ inputs.sha }}
        # Both attestation manifests show up as untagged package versions even though the
        # tagged index references them, which breaks the popular "delete all untagged
        # versions" GHCR cleanup recipe. Neither is needed here.
        provenance: false
        sbom: false
        # mode=max: without it, a multi-stage build only caches the final stage and throws
        # away the expensive builder layers.
        cache-from: type=registry,ref=${{ steps.cache.outputs.name }}:${{ inputs.service }}
        cache-to: type=registry,ref=${{ steps.cache.outputs.name }}:${{ inputs.service }},mode=max
