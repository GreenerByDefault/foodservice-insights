name: Deploy target
description: >
  Resolve the commit a deploy job may ship, refusing one that main has not merged, then wait for
  main's CI on it. Expects a full-history checkout of main's tip.

inputs:
  sha:
    description: The workflow_dispatch input; blank means main's tip
    required: false
    default: ''

outputs:
  sha:
    description: The full 40-character commit SHA to deploy
    value: ${{ steps.resolve.outputs.sha }}
  ci:
    description: >
      The conclusion of CI on that commit, success or cancelled — anything else fails this action.
      A cancelled run was never finished, so the caller decides whether that is because main moved
      on.
    value: ${{ steps.ci.outputs.conclusion }}
  ci_url:
    description: The CI run's page, for messages
    value: ${{ steps.ci.outputs.url }}

runs:
  using: composite
  steps:
    # The deploy tooling is this ref's copy, and a blank sha deploys this ref's tip, so a dispatch
    # from a feature branch would run and ship unmerged code.
    - name: Refuse a dispatch from outside main
      if: github.ref != 'refs/heads/main'
      shell: bash
      run: |
        echo "::error::Deploys run from main only, not ${GITHUB_REF#refs/heads/}. Run the workflow again with 'Use workflow from' set to main, and put the commit you want in 'Commit SHA to deploy'."
        exit 1

    - name: Resolve the target commit
      id: resolve
      shell: bash
      env:
        INPUT_SHA: ${{ inputs.sha }}
      run: |
        target="${INPUT_SHA:-$GITHUB_SHA}"
        if ! sha=$(git rev-parse --verify --quiet --end-of-options "${target}^{commit}"); then
          echo "::error::'$target' is not a commit in this repo. Check 'Commit SHA to deploy' for a typo."
          exit 1
        fi
        if ! git merge-base --is-ancestor "$sha" origin/main; then
          echo "::error::$(git rev-parse --short "$sha") is not on main, and only merged commits deploy. Merge it first."
          exit 1
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    # The main ruleset requires CI but not an up-to-date branch, and PR CI runs only what a PR
    # affects, so two PRs green apart can merge red together. Main's own unfiltered CI is the first
    # run that tests the merged commit.
    #
    # This polls the workflow run rather than CI's aggregate check run: concurrency cancels a
    # queued run when a newer push queues behind it, before any job — and so any check run — exists.
    - name: Wait for main's CI on the target commit
      id: ci
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ steps.resolve.outputs.sha }}
      run: |
        short=$(git rev-parse --short "$SHA")

        # Always a new run, never a re-run: a re-run keeps the commit its first attempt resolved,
        # so a blank sha would no longer mean main's latest. And a push run is told to leave sha
        # blank, because naming a commit skips the supersession check and could roll prod back.
        next_step() {
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "If that was a flake, re-run that CI and, once it passes, run this workflow from main with 'Commit SHA to deploy' blank. Otherwise fix main forward: the next push whose CI passes deploys."
          else
            echo "If that was a flake, re-run that CI and, once it passes, run this workflow again with the same inputs. Otherwise fix main forward, or choose a different commit whose CI passed."
          fi
        }
        runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=1"
        no_run_deadline=$((SECONDS + 300))
        last_status=
        while :; do
          run=$(gh api "$runs" --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')
          read -r status conclusion url <<< "$run"
          if [ -z "$status" ]; then
            if [ -z "$last_status" ]; then
              echo "Waiting for main's CI run on $short to appear…"
              last_status=missing
            fi
            if [ "$SECONDS" -gt "$no_run_deadline" ]; then
              echo "::error::$short has no CI run on main, so it was never tested as merged — usually because it arrived in the same push as a later commit. Pick a commit that has one: Actions → CI, filtered to the main branch."
              exit 1
            fi
          elif [ "$status" = completed ]; then
            break
          elif [ "$status" != "$last_status" ]; then
            echo "Waiting for main's CI on $short ($status): $url"
            last_status=$status
          fi
          sleep 30
        done

        case "$conclusion" in
          success) echo "CI passed on $short: $url" ;;
          cancelled)
            echo "::notice::CI on $short was cancelled before it finished, usually because a newer push queued behind it: $url"
            ;;
          *)
            echo "::error::Not deploying $short: its CI on main concluded $conclusion. See $url. $(next_step)"
            exit 1
            ;;
        esac
        echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
        echo "url=$url" >> "$GITHUB_OUTPUT"
