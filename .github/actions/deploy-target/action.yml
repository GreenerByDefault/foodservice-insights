name: Deploy target
description: >
  Resolve the commit a deploy job may ship, refusing one that main has not merged. Expects a
  full-history checkout of main's tip.

inputs:
  sha:
    description: The workflow_dispatch input; blank means main's tip
    required: false
    default: ''

outputs:
  sha:
    description: The full 40-character commit SHA to deploy
    value: ${{ steps.resolve.outputs.sha }}

runs:
  using: composite
  steps:
    # The deploy tooling is this ref's copy, and a blank sha deploys this ref's tip, so a dispatch
    # from a feature branch would run and ship unmerged code. This catches a mistake, not an
    # attacker: a branch's own deploy.yml can simply not call it.
    - name: Refuse a dispatch from outside main
      if: github.ref != 'refs/heads/main'
      shell: bash
      run: |
        echo "::error::Deploys run from main only, not ${GITHUB_REF#refs/heads/}. Run the workflow again with 'Use workflow from' set to main, and put the commit you want in 'Commit SHA to deploy'."
        exit 1

    - name: Resolve the target commit
      id: resolve
      shell: bash
      env:
        INPUT_SHA: ${{ inputs.sha }}
      run: |
        target="${INPUT_SHA:-$GITHUB_SHA}"
        if ! sha=$(git rev-parse --verify --quiet --end-of-options "${target}^{commit}"); then
          echo "::error::'$target' is not a commit in this repo. Check 'Commit SHA to deploy' for a typo."
          exit 1
        fi
        if ! git merge-base --is-ancestor "$sha" origin/main; then
          echo "::error::$(git rev-parse --short "$sha") is not on main, and only merged commits deploy. A squash merge gives main a new commit, so if its PR has merged, deploy the commit it became on main instead."
          exit 1
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
