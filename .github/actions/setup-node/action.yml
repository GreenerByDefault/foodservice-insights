name: Setup
description: Install pnpm, Node, and workspace dependencies

runs:
  using: composite
  steps:
    # Installs the pnpm in package.json's `packageManager`, then runs the install itself.
    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        node-version-file: .nvmrc
        cache: true
        require-lockfile: true
