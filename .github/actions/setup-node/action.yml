name: Setup
description: Install pnpm, Node, and workspace dependencies

runs:
  using: composite
  steps:
    # Installs the pnpm in package.json's `packageManager`, then runs the install itself.
    - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        node-version-file: .nvmrc
        cache: true
        require-lockfile: true
