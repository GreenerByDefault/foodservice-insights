name: Setup
description: Install pnpm, Node, and workspace dependencies

runs:
  using: composite
  steps:
    # Installs the pnpm in package.json's `packageManager`, then runs the install itself.
    - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        node-version-file: .nvmrc
        cache: true
        require-lockfile: true
