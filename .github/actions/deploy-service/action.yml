name: Deploy service
description: >
  Resolve one named service's commit-tagged image to a digest, then deploy that digest to the
  service's App Platform app by submitting its spec in `.do/`.

inputs:
  service:
    description: Service to deploy (web or worker)
    required: true
  sha:
    description: Commit SHA to deploy — the full 40 characters, not an abbreviation
    required: true

outputs:
  digest:
    description: The resolved image digest (sha256:...)
    value: ${{ steps.resolve.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/resolve-image-name
      id: image
      with:
        service: ${{ inputs.service }}

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # Deliberately unauthenticated so that we can confirm the images are public.
    - name: Resolve digest
      id: resolve
      shell: bash
      run: |
        image="${{ steps.image.outputs.name }}:${{ inputs.sha }}"
        if ! digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}' 2>&1); then
          echo "::error::Could not resolve $image to a digest. Either no build ever pushed a tag for this commit (build-${{ inputs.service }} has to run first), or the ${{ inputs.service }} package went private again — this is the same anonymous pull the hosting provider will make."
          echo "$digest"
          exit 1
        fi
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "Resolved ${{ inputs.service }}@${{ inputs.sha }} to $digest"

    # The version is pinned because the step below relies on its `--spec -` and `--wait` behavior.
    - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
      with:
        version: 2.0.0
        no_auth: true # doctl reads DIGITALOCEAN_ACCESS_TOKEN from the env

    # The caller passes the token, the app ID, and every `${NAME}` in the spec as env, since a
    # composite action can't read secrets. Rendering to a file first means a missing value fails
    # the step before doctl submits anything. `--wait` exits nonzero when the deployment fails,
    # including when the new instance never passes its health check and App Platform rolls back.
    #
    # *Rejected: digitalocean/app_action.* It finds the app by the spec's `name` and creates one when
    # none matches, so a rename would start a second app, and it expands an unset variable to "".
    - name: Deploy
      shell: bash
      env:
        IMAGE_DIGEST: ${{ steps.resolve.outputs.digest }}
      run: |
        spec="$RUNNER_TEMP/${{ inputs.service }}.yaml"
        yq '(.. | select(tag == "!!str")) |= envsubst(nu, ne, ff)' ".do/${{ inputs.service }}.yaml" > "$spec"
        doctl apps update "$DO_APP_ID" --spec "$spec" --wait
