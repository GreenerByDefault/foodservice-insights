name: Setup Python
description: Install uv and sync the Python workspace

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # Match apps/worker/Dockerfile's uv image, which Dependabot bumps.
        version: "0.12.9"
        enable-cache: true
    - run: uv sync --locked --all-packages
      shell: bash
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: 1.58.0
