name: Setup Python
description: Install uv and sync the Python workspace

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        # Match apps/worker/Dockerfile's uv image, which Dependabot bumps.
        version: "0.12.9"
        enable-cache: true
    - run: uv sync --locked --all-packages
      shell: bash
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: 1.58.0
