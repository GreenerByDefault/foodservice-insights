name: Setup Python
description: Install uv and sync the Python workspace

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "0.11.27"
        enable-cache: true
    - run: uv sync --locked --all-packages
      shell: bash
    - uses: extractions/setup-just@v3
      with:
        just-version: 1.58.0
