name: Setup Python
description: Install uv and sync the Python workspace

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        # Match apps/worker/Dockerfile's uv image, which Dependabot bumps.
        version: "0.12.9"
        enable-cache: true
    - run: uv sync --locked --all-packages
      shell: bash
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: 1.58.0
