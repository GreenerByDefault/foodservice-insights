name: Playwright browsers
description: Install and cache the Chromium build that Playwright uses

runs:
  using: composite
  steps:
    # Keyed on the catalog file rather than the resolved version, so it
    # over-invalidates on unrelated catalog edits instead of under-invalidating.
    - uses: actions/cache@v6
      id: cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-workspace.yaml') }}

    - if: steps.cache.outputs.cache-hit != 'true'
      run: pnpm --filter @gbd/web exec playwright install --with-deps chromium
      shell: bash

    # The OS-level shared libraries the browser links against aren't cached.
    - if: steps.cache.outputs.cache-hit == 'true'
      run: pnpm --filter @gbd/web exec playwright install-deps chromium
      shell: bash
