packages:
  - apps/*
  - packages/*

engineStrict: true
verifyDepsBeforeRun: warn

strictPeerDependencies: true

allowBuilds:
  esbuild: true

catalog:
  # --- Shared toolchain --------------------------------------------------
  typescript: ^6.0.3
  '@types/node': ^24.10.0
  '@biomejs/biome': 2.5.10

  # --- Svelte ------------------------------------------------------------
  svelte: ^5.56.10
  svelte-check: ^4.7.6
  '@sveltejs/kit': ^2.70.3
  '@sveltejs/adapter-node': ^5.5.7
  '@sveltejs/vite-plugin-svelte': ^7.3.0
  vite: ^8.2.2

  # --- Styling / shadcn-svelte -------------------------------------------
  # When `shadcn-svelte add <component>` rewrites apps/web/package.json with a
  # literal version, move it here and restore `catalog:` in the package.
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  shadcn-svelte: ^1.5.0
  '@lucide/svelte': ^1.33.0
  '@fontsource-variable/inter': ^5.3.0
  tw-animate-css: ^1.4.0
  bits-ui: ^2.19.0
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  tailwind-variants: ^3.3.1
  '@internationalized/date': ^3.12.3
  # Transitive deps of bits-ui; direct because our own code (the ported file-drop-zone) imports
  # them too.
  runed: ^0.37.1
  svelte-toolbelt: ^0.10.6

  # --- Database ---------------------------------------------------------------
  kysely: ^0.29.5
  pg: ^8.23.0
  '@types/pg': ^8.23.1
  kanel: ^4.0.3
  kanel-kysely: ^4.0.0
  # Only here because kanel peer-depends on it to format its output. We format with
  # Biome; `pnpm db:gen-types` re-formats the generated files after kanel runs.
  prettier: ^3.6.2

  # --- Blob store -------------------------------------------------------------
  '@aws-sdk/client-s3': ^3.1116.0
  '@aws-sdk/s3-request-presigner': ^3.1116.0
  # Only for `ConfiguredRetryStrategy`; keep the range within what `@aws-sdk/client-s3`
  # itself depends on, so one copy resolves.
  '@smithy/core': ^3.33.3
  # Only for the `HttpRequest` type `breakable.ts` needs to redirect a request mid-flight;
  # keep the range within what `@aws-sdk/client-s3` itself depends on.
  '@smithy/types': ^4.17.0

  # --- Validation -------------------------------------------------------------
  valibot: ^1.4.2

  # --- Vitest -----------------------------------------------------------------
  vitest: 4.1.10
  '@vitest/browser-playwright': 4.1.10
  vitest-browser-svelte: 3.0.0

  # --- Playwright -------------------------------------------------------------
  playwright: 1.62.1
  '@playwright/test': 1.62.1

# pnpm 11 blocks very-recently-published packages by default; exceptions go here.
# Drop an entry once the version is no longer new.
minimumReleaseAgeExclude:
  - shadcn-svelte@1.5.0
