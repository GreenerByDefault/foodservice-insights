packages:
  - apps/*
  - packages/*
  - tests/*

engineStrict: true
verifyDepsBeforeRun: warn

strictPeerDependencies: true

allowBuilds:
  esbuild: true

catalog:
  # --- Shared toolchain --------------------------------------------------
  typescript: ^6.0.3
  '@types/node': ^24.10.0
  '@biomejs/biome': 2.5.15

  # --- Svelte ------------------------------------------------------------
  svelte: ^5.57.1
  svelte-check: ^4.7.6
  '@sveltejs/kit': ^3.0.0
  '@sveltejs/adapter-node': ^6.0.0
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  vite: ^8.3.2

  # --- Styling / shadcn-svelte -------------------------------------------
  # When `shadcn-svelte add <component>` rewrites apps/web/package.json with a
  # literal version, move it here and restore `catalog:` in the package.
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  shadcn-svelte: ^1.7.0
  '@lucide/svelte': ^1.49.0
  '@fontsource-variable/inter': ^5.3.0
  tw-animate-css: ^1.4.0
  svelte-sonner: ^1.2.1
  bits-ui: ^2.19.4
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  tailwind-variants: ^3.3.1
  '@internationalized/date': ^3.12.4
  # Transitive deps of bits-ui; direct because our own code (the ported file-drop-zone) imports
  # them too.
  runed: ^0.37.1
  svelte-toolbelt: ^0.10.6

  # --- Database ---------------------------------------------------------------
  kysely: ^0.29.6
  pg: ^8.23.1
  '@types/pg': ^8.23.1
  kanel: ^4.0.4
  kanel-kysely: ^4.0.0
  # Only here because kanel peer-depends on it to format its output. We format with
  # Biome; `pnpm db:gen-types` re-formats the generated files after kanel runs.
  prettier: ^3.9.9

  # --- Blob store -------------------------------------------------------------
  '@aws-sdk/client-s3': ^3.1145.0
  '@aws-sdk/s3-request-presigner': ^3.1145.0
  # Only for `ConfiguredRetryStrategy`; keep the range within what `@aws-sdk/client-s3`
  # itself depends on, so one copy resolves.
  '@smithy/core': ^3.35.1
  # Only for the `HttpRequest` type `breakable.ts` needs to redirect a request mid-flight;
  # keep the range within what `@aws-sdk/client-s3` itself depends on.
  '@smithy/types': ^4.19.0

  # --- Spreadsheets -----------------------------------------------------------
  read-excel-file: ^9.3.10
  # Direct because `excel/zip.ts` reads a workbook's central directory itself, to cap the
  # declared uncompressed size before `read-excel-file` inflates anything. Keep the range
  # within what `read-excel-file` depends on, so one copy resolves.
  fflate: ^0.8.3

  # --- Validation -------------------------------------------------------------
  valibot: ^1.5.0

  # --- Logging ----------------------------------------------------------------
  pino: ^10.3.1
  pino-pretty: ^13.1.3

  # --- Auth -------------------------------------------------------------------
  # Supabase is a token service and nothing more — see ARCHITECTURE.md § Supabase.
  '@supabase/ssr': ^0.12.7
  '@supabase/supabase-js': ^2.117.2

  # --- Vitest -----------------------------------------------------------------
  vitest: 4.1.11
  '@vitest/browser-playwright': 4.1.11
  vitest-browser-svelte: 3.1.0

  # --- Playwright -------------------------------------------------------------
  playwright: 1.63.0
  '@playwright/test': 1.63.0

# runed's `@sveltejs/kit` peer is optional and only backs its `runed/kit` subpath, which we don't
# import; no runed release declares SvelteKit 3 yet. Drop this once one does.
peerDependencyRules:
  allowedVersions:
    runed>@sveltejs/kit: '3'

# pnpm 11 blocks very-recently-published packages by default; exceptions go here.
# Drop an entry once the version is no longer new.
minimumReleaseAgeExclude:
  - shadcn-svelte@1.5.0

# Fix for https://github.com/huntabyte/bits-ui/pull/2166.
patchedDependencies:
  bits-ui@2.18.1: patches/bits-ui@2.18.1.patch
# bits-ui is only a dependency of @gbd/web, so `pnpm deploy --filter @gbd/worker` (apps/worker's
# Dockerfile) prunes it out of scope entirely — pnpm would otherwise treat the patch above as
# unused and fail that deploy.
allowUnusedPatches: true

# Security floors for transitive deps whose parents have not yet bumped them. Drop an entry once
# the lockfile resolves past it without help (`pnpm audit` is clean).
overrides:
  brace-expansion@5: ^5.0.12
  cookie@<0.7.0: ^0.7.0
  devalue@<5.9.3: ^5.9.3
  nanoid@3: ^3.3.18
  source-map-js@<1.2.2: ^1.2.2
