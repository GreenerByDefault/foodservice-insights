<!-- A placeholder until GBD supplies the real mark (REQUIREMENTS.md § Landing page). The two raster
     copies in `static/` are generated from this file; after changing it, regenerate them from
     `apps/web`:
       rsvg-convert -w 32 -h 32 src/lib/assets/favicon.svg | magick - static/favicon.ico
       rsvg-convert -w 180 -h 180 -b '#171717' src/lib/assets/favicon.svg -o static/apple-touch-icon.png
     The touch icon is filled to the edge because iOS rounds its corners itself. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Foodservice Insights</title>
  <rect width="32" height="32" rx="7" fill="#171717" />
  <path d="M8 24C8 14.6 14.6 8 24 8c0 9.4-6.6 16-16 16Z" fill="#fff" />
  <path d="M8 24 18 14" stroke="#171717" stroke-width="2" stroke-linecap="round" />
</svg>
