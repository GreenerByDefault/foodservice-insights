apiVersion: dashboard.grafana.app/v2beta1
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: foodservice-insights
    grafana.app/grant-permissions: default
  labels: null
  name: operations
  namespace: ""
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: "Off"
  description: How the analysis runs, for the people who keep it running.
  editable: true
  elements:
    at-a-glance:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: metrics
                  group: grafana-postgresql-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      WITH finished AS (
                        SELECT status, failure_reason FROM metrics.attempt
                        WHERE status IN ('succeeded', 'failed') AND $__timeFilter(finished_at)
                      )
                      SELECT
                        (SELECT count(*) FROM finished) AS "Attempts finished",
                        (SELECT avg((status = 'failed' AND failure_reason IS DISTINCT FROM 'unusable_data')::int)
                          FROM finished) AS "Failed for our reasons",
                        (SELECT sum(failed_requests)::double precision / nullif(sum(requests), 0)
                          FROM metrics.attempt_llm_usage
                          WHERE $__timeFilter(recorded_at)) AS "LLM requests failed",
                        (SELECT max(peak_memory_kib) FROM metrics.attempt_telemetry
                          WHERE $__timeFilter(recorded_at)) AS "Largest peak memory",
                        (SELECT sum(connections)::double precision / max(max_connections)
                          FROM metrics.database_connection) AS "Connections in use now"
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: 'Over the time range: attempts that succeeded or failed; the
          share that failed for any reason but unusable data, which is the uploaded
          file''s; the share of requests to OpenAI that failed, each retried or ending
          its call; and the most memory one analysis used. Connections is right now,
          whatever the time range: every role''s, against the server''s max_connections.'
        id: 1
        links: []
        title: At a glance
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: text
                  mode: fixed
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                  - color: red
                    value: 80
              overrides:
              - matcher:
                  id: byName
                  options: Attempts finished
                properties:
                - id: decimals
                  value: 0
              - matcher:
                  id: byRegexp
                  options: Failed for our reasons|LLM requests failed|Connections in use now
                properties:
                - id: unit
                  value: percentunit
                - id: decimals
                  value: 1
              - matcher:
                  id: byName
                  options: Largest peak memory
                properties:
                - id: unit
                  value: kbytes
                - id: decimals
                  value: 0
            options:
              colorMode: value
              graphMode: none
              justifyMode: center
              orientation: vertical
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
                fields: ""
                values: false
              showPercentChange: false
              textMode: value_and_name
              wideLayout: true
          version: 13.2.4
    stage-time-per-week:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: metrics
                  group: grafana-postgresql-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      SELECT
                        date_trunc('week', recorded_at) AS time,
                        percentile_cont(0.5) WITHIN GROUP (ORDER BY read_duration_ms) AS "Read p50",
                        percentile_cont(0.95) WITHIN GROUP (ORDER BY read_duration_ms) AS "Read p95",
                        percentile_cont(0.5) WITHIN GROUP (ORDER BY categorize_duration_ms) AS "Categorize p50",
                        percentile_cont(0.95) WITHIN GROUP (ORDER BY categorize_duration_ms) AS "Categorize p95",
                        percentile_cont(0.5) WITHIN GROUP (ORDER BY report_duration_ms) AS "Report p50",
                        percentile_cont(0.95) WITHIN GROUP (ORDER BY report_duration_ms) AS "Report p95",
                        percentile_cont(0.5) WITHIN GROUP (ORDER BY pdf_duration_ms) AS "PDF p50",
                        percentile_cont(0.95) WITHIN GROUP (ORDER BY pdf_duration_ms) AS "PDF p95",
                        percentile_cont(0.5) WITHIN GROUP (ORDER BY xlsx_duration_ms) AS "XLSX p50",
                        percentile_cont(0.95) WITHIN GROUP (ORDER BY xlsx_duration_ms) AS "XLSX p95"
                      FROM metrics.attempt_telemetry
                      WHERE $__timeFilter(recorded_at)
                      GROUP BY 1
                      ORDER BY 1
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: Median and 95th percentile of each stage of the analysis, over
          the attempts that finished that stage each week, Monday to Sunday in UTC,
          failed ones included. An attempt that failed mid-stage has no time for it.
          The axis is logarithmic, since categorizing takes minutes and the rest seconds.
        id: 2
        links: []
        title: Stage time per week
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ""
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 0
                  gradientMode: none
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 2
                  pointSize: 4
                  scaleDistribution:
                    log: 10
                    type: log
                  showPoints: always
                  showValues: false
                  spanNulls: false
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: "off"
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                  - color: red
                    value: 80
                unit: ms
              overrides:
              - matcher:
                  id: byRegexp
                  options: Read .*
                properties:
                - id: color
                  value:
                    fixedColor: green
                    mode: fixed
              - matcher:
                  id: byRegexp
                  options: Categorize .*
                properties:
                - id: color
                  value:
                    fixedColor: purple
                    mode: fixed
              - matcher:
                  id: byRegexp
                  options: Report .*
                properties:
                - id: color
                  value:
                    fixedColor: blue
                    mode: fixed
              - matcher:
                  id: byRegexp
                  options: PDF .*
                properties:
                - id: color
                  value:
                    fixedColor: orange
                    mode: fixed
              - matcher:
                  id: byRegexp
                  options: XLSX .*
                properties:
                - id: color
                  value:
                    fixedColor: yellow
                    mode: fixed
              - matcher:
                  id: byRegexp
                  options: .* p95
                properties:
                - id: custom.lineStyle
                  value:
                    dash:
                    - 6
                    - 4
                    fill: dash
                - id: custom.lineWidth
                  value: 1
            options:
              legend:
                calcs: []
                displayMode: list
                placement: bottom
                showLegend: true
              tooltip:
                hideZeros: false
                mode: multi
                sort: none
          version: 13.2.4
    llm-requests-failed-per-week:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: metrics
                  group: grafana-postgresql-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      SELECT
                        date_trunc('week', recorded_at) AS time,
                        sum(rate_limited_requests)::double precision / nullif(sum(requests), 0)
                          AS "Rate limited (429)",
                        sum(failed_requests - rate_limited_requests)::double precision / nullif(sum(requests), 0)
                          AS "Other failures"
                      FROM metrics.attempt_llm_usage
                      WHERE $__timeFilter(recorded_at)
                      GROUP BY 1
                      ORDER BY 1
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: Of the requests to OpenAI each week, Monday to Sunday in UTC,
          the share that failed, stacked by whether OpenAI rate limited them. A call
          retries a failed request, so these cost time, and an attempt fails as upstream_api
          only once a call runs out of retries. Includes attempts since deleted.
        id: 3
        links: []
        title: LLM requests failed per week
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ""
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: bars
                  fillOpacity: 80
                  gradientMode: none
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 1
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: false
                  stacking:
                    group: A
                    mode: normal
                  thresholdsStyle:
                    mode: "off"
                min: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                  - color: red
                    value: 80
                unit: percentunit
              overrides:
              - matcher:
                  id: byName
                  options: Rate limited (429)
                properties:
                - id: color
                  value:
                    fixedColor: orange
                    mode: fixed
              - matcher:
                  id: byName
                  options: Other failures
                properties:
                - id: color
                  value:
                    fixedColor: red
                    mode: fixed
            options:
              legend:
                calcs: []
                displayMode: list
                placement: bottom
                showLegend: true
              tooltip:
                hideZeros: false
                mode: multi
                sort: none
          version: 13.2.4
    quality-checks-firing:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: metrics
                  group: grafana-postgresql-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      WITH built AS (
                        SELECT analysis_attempt_id FROM metrics.attempt_telemetry
                        WHERE quality_status IS NOT NULL AND $__timeFilter(recorded_at)
                      ), worst AS (
                        SELECT q.quality_check, max(q.status) AS status
                        FROM metrics.attempt_quality_check q
                        JOIN built USING (analysis_attempt_id)
                        GROUP BY q.analysis_attempt_id, q.quality_check
                      )
                      SELECT
                        quality_check::text AS "Check",
                        count(*) FILTER (WHERE status = 'warning')::double precision
                          / (SELECT count(*) FROM built) AS "Warning",
                        count(*) FILTER (WHERE status = 'error')::double precision
                          / (SELECT count(*) FROM built) AS "Error"
                      FROM worst
                      GROUP BY 1
                      ORDER BY count(*) DESC, 1
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: Over the time range, the share of attempts that built a report
          in which each quality check fired, by its worst finding. An error makes
          the report invalid. A check that never fired is left out.
        id: 4
        links: []
        title: Quality checks firing
        vizConfig:
          group: barchart
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ""
                  axisPlacement: auto
                  fillOpacity: 80
                  gradientMode: none
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  lineWidth: 1
                  scaleDistribution:
                    type: linear
                  thresholdsStyle:
                    mode: "off"
                min: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                  - color: red
                    value: 80
                unit: percentunit
              overrides:
              - matcher:
                  id: byName
                  options: Warning
                properties:
                - id: color
                  value:
                    fixedColor: yellow
                    mode: fixed
              - matcher:
                  id: byName
                  options: Error
                properties:
                - id: color
                  value:
                    fixedColor: red
                    mode: fixed
            options:
              barRadius: 0
              barWidth: 0.6
              fullHighlight: false
              groupWidth: 0.7
              legend:
                calcs: []
                displayMode: list
                placement: bottom
                showLegend: true
              orientation: horizontal
              showValue: never
              stacking: normal
              tooltip:
                hideZeros: false
                mode: multi
                sort: none
              xTickLabelRotation: 0
              xTickLabelSpacing: 0
          version: 13.2.4
    peak-memory-per-week:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: metrics
                  group: grafana-postgresql-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      SELECT
                        date_trunc('week', recorded_at) AS time,
                        percentile_cont(0.5) WITHIN GROUP (ORDER BY peak_memory_kib) AS "p50",
                        percentile_cont(0.95) WITHIN GROUP (ORDER BY peak_memory_kib) AS "p95",
                        max(peak_memory_kib) AS "Largest"
                      FROM metrics.attempt_telemetry
                      WHERE $__timeFilter(recorded_at)
                      GROUP BY 1
                      ORDER BY 1
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: The most memory each analysis held at once, its child process's
          peak resident set, over the attempts each week, Monday to Sunday in UTC.
          It grows with the upload's rows. The worker runs up to three at once, so
          three of the largest must fit beside the worker itself.
        id: 5
        links: []
        title: Peak memory per week
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: blue
                  mode: fixed
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ""
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 0
                  gradientMode: none
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 2
                  pointSize: 4
                  scaleDistribution:
                    type: linear
                  showPoints: always
                  showValues: false
                  spanNulls: false
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: "off"
                min: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                  - color: red
                    value: 80
                unit: kbytes
              overrides:
              - matcher:
                  id: byName
                  options: p95
                properties:
                - id: custom.lineStyle
                  value:
                    dash:
                    - 6
                    - 4
                    fill: dash
                - id: custom.lineWidth
                  value: 1
              - matcher:
                  id: byName
                  options: Largest
                properties:
                - id: custom.lineStyle
                  value:
                    dash:
                    - 0
                    - 4
                    fill: dot
                - id: custom.lineWidth
                  value: 1
            options:
              legend:
                calcs: []
                displayMode: list
                placement: bottom
                showLegend: true
              tooltip:
                hideZeros: false
                mode: multi
                sort: none
          version: 13.2.4
    database-connections-by-role:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: metrics
                  group: grafana-postgresql-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                        role || coalesce(' (limit ' || connection_limit || ')', '') AS "Role",
                        connections AS "Connections"
                      FROM metrics.database_connection
                      ORDER BY connections DESC, role
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: Connections each database role holds right now, whatever the
          time range, with the role's own limit where it has one. Supabase's services
          connect as their own roles, and they all share the server's max_connections.
          Dashboards connect as metrics_reader, so loading this one adds a few. budget.ts
          sets the limits.
        id: 6
        links: []
        title: Database connections now, by role
        vizConfig:
          group: barchart
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: blue
                  mode: fixed
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ""
                  axisPlacement: auto
                  fillOpacity: 80
                  gradientMode: none
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  lineWidth: 1
                  scaleDistribution:
                    type: linear
                  thresholdsStyle:
                    mode: "off"
                decimals: 0
                min: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                  - color: red
                    value: 80
              overrides: []
            options:
              barRadius: 0
              barWidth: 0.6
              fullHighlight: false
              groupWidth: 0.7
              legend:
                calcs: []
                displayMode: list
                placement: bottom
                showLegend: false
              orientation: horizontal
              showValue: auto
              stacking: none
              tooltip:
                hideZeros: false
                mode: single
                sort: none
              xTickLabelRotation: 0
              xTickLabelSpacing: 0
          version: 13.2.4
  layout:
    kind: GridLayout
    spec:
      items:
      - kind: GridLayoutItem
        spec:
          element:
            kind: ElementReference
            name: at-a-glance
          height: 4
          width: 24
          x: 0
          "y": 0
      - kind: GridLayoutItem
        spec:
          element:
            kind: ElementReference
            name: stage-time-per-week
          height: 9
          width: 12
          x: 0
          "y": 4
      - kind: GridLayoutItem
        spec:
          element:
            kind: ElementReference
            name: llm-requests-failed-per-week
          height: 9
          width: 12
          x: 12
          "y": 4
      - kind: GridLayoutItem
        spec:
          element:
            kind: ElementReference
            name: peak-memory-per-week
          height: 8
          width: 12
          x: 0
          "y": 13
      - kind: GridLayoutItem
        spec:
          element:
            kind: ElementReference
            name: database-connections-by-role
          height: 8
          width: 12
          x: 12
          "y": 13
      - kind: GridLayoutItem
        spec:
          element:
            kind: ElementReference
            name: quality-checks-firing
          height: 7
          width: 24
          x: 0
          "y": 21
  links: []
  liveNow: false
  preload: false
  tags: []
  timeSettings:
    autoRefresh: ""
    autoRefreshIntervals:
    - 5s
    - 10s
    - 30s
    - 1m
    - 5m
    - 15m
    - 30m
    - 1h
    - 2h
    - 1d
    fiscalYearStartMonth: 0
    from: now-6M
    hideTimepicker: false
    timezone: browser
    to: now
  title: Operations
  variables: []
