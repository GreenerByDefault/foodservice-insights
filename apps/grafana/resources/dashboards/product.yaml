apiVersion: dashboard.grafana.app/v2beta1
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: foodservice-insights
    grafana.app/grant-permissions: default
  labels: null
  name: product
  namespace: ""
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: "Off"
  description: How customers use the product.
  editable: true
  elements:
    reports-per-week:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: metrics
                  group: grafana-postgresql-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    format: time_series
                    rawQuery: true
                    rawSql: |-
                      SELECT date_trunc('week', created_at) AS time, count(*) AS reports
                      FROM metrics.report
                      WHERE $__timeFilter(created_at)
                      GROUP BY 1
                      ORDER BY 1
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: Reports created each week, Monday to Sunday in UTC, including
          ones since deleted.
        id: 1
        links: []
        title: Reports per week
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ""
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: bars
                  fillOpacity: 80
                  gradientMode: none
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 1
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: false
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: "off"
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                  - color: red
                    value: 80
              overrides: []
            options:
              legend:
                calcs: []
                displayMode: list
                placement: bottom
                showLegend: true
              tooltip:
                hideZeros: false
                mode: single
                sort: none
          version: 13.2.4
  layout:
    kind: GridLayout
    spec:
      items:
      - kind: GridLayoutItem
        spec:
          element:
            kind: ElementReference
            name: reports-per-week
          height: 8
          width: 12
          x: 0
          "y": 0
  links: []
  liveNow: false
  preload: false
  tags: []
  timeSettings:
    autoRefresh: ""
    autoRefreshIntervals:
    - 5s
    - 10s
    - 30s
    - 1m
    - 5m
    - 15m
    - 30m
    - 1h
    - 2h
    - 1d
    fiscalYearStartMonth: 0
    from: now-6M
    hideTimepicker: false
    timezone: browser
    to: now
  title: Product
  variables: []
