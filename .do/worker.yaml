# The worker's App Platform spec. See README.md before changing it.

name: foodservice-insights-worker
region: ric

workers:
  - name: foodservice-insights-worker
    image:
      registry_type: GHCR
      registry: greenerbydefault
      repository: foodservice-insights/worker
      digest: ${IMAGE_DIGEST}
    # `budget.test.ts` holds the count to `WORKER_INSTANCES`. **Open:** drop to `apps-s-1vcpu-1gb`
    # once production shows the parent plus three children staying well under 1 GB.
    instance_size_slug: apps-s-1vcpu-2gb
    instance_count: 1
    # App Platform's maximum. Its default of 120 would SIGKILL the worker mid-drain, which looks
    # exactly like a worker bug. `config.test.ts` holds `PLATFORM_SHUTDOWN_GRACE_MS` to it.
    termination:
      grace_period_seconds: 600

    # No liveness probe, and there is no port to give one. A crashed parent exits and is restarted,
    # which the restart rule sees. A wedged one stops renewing its leases, so other workers reap its
    # attempts as `abandoned`, or, if it is the only worker, its queue goes unclaimed.

    # Starting thresholds, to tune after the first month of real traffic.
    #
    # There is no disk rule, because App Platform has none. Each run directory is deleted when its
    # attempt settles, and a full disk replaces the container. **Open:** whether the restart rule
    # counts a replacement. It likely does not, since the new container's count starts at zero, and
    # then the attempts the old one held are what show it: reaped as `abandoned`, which the data
    # layer's failures rule counts. Until that layer is built, a full disk goes unalerted.
    alerts:
      # Busy for longer than any one attempt takes, so attempts are slowing each other down.
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 90
        window: THIRTY_MINUTES
      # Children are close to being killed for memory, which fails their attempts. The kernel
      # kills the largest process, a child, so the container survives and the restart rule never
      # sees it. One child climbing to that kill within an attempt is averaged away here too, so
      # the data layer's failures rule is what catches it. Revisit when the size drops to 1 GB.
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      # The parent exited: a crash, an out-of-memory kill, or a claim Postgres refused.
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        # Not 0: the API reads 0 as missing and rejects the spec. There is no GREATER_THAN_OR_EQUAL.
        value: 0.5
        window: FIVE_MINUTES

    envs:
      # Not `live` until the categorization caches are in Supabase
      # (`.claude/plans/caches-to-supabase.md` § Go-live), which also adds `OPENAI_API_KEY`.
      - key: WORKER_MODE
        value: mock-llm
      - key: PLATFORM_SHUTDOWN_GRACE_MS
        value: "600000"

      - key: DB_CONNECTION_STRING
        type: SECRET
        value: ${DB_CONNECTION_STRING}
      - key: DB_SSL_CA
        value: ${DB_SSL_CA}

      - key: S3_ENDPOINT
        value: ${S3_ENDPOINT}
      - key: S3_REGION
        value: ${S3_REGION}
      - key: S3_ACCESS_KEY_ID
        type: SECRET
        value: ${S3_ACCESS_KEY_ID}
      - key: S3_SECRET_ACCESS_KEY
        type: SECRET
        value: ${S3_SECRET_ACCESS_KEY}
      - key: S3_BUCKET
        value: ${S3_BUCKET}

      - key: EMAIL_TRANSPORT
        value: provider
      - key: EMAIL_FROM_ADDRESS
        value: insights@greenerbydefault.org
      - key: EMAIL_SUPPORT_ADDRESS
        value: insights@greenerbydefault.org
      - key: EMAIL_GBD_ADDRESS
        value: insights@greenerbydefault.org
      - key: SITE_URL
        value: ${SITE_URL}

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
