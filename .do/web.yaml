# The web app's App Platform spec. See README.md before changing it.

name: foodservice-insights-web
region: ric

services:
  - name: foodservice-insights-web
    image:
      registry_type: GHCR
      registry: greenerbydefault
      repository: foodservice-insights/web
      digest: ${IMAGE_DIGEST}
    # `budget.test.ts` holds the count to `WEB_INSTANCES`. This size can't run a second instance.
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 3000
    health_check:
      http_path: /health/ready
    liveness_health_check:
      http_path: /health/live

    # Starting thresholds, to tune after the first month of real traffic.
    # *Considered, not done: a request-rate rule.* Nothing yet says what rate is wrong, and
    # App Platform's edge absorbs floods.
    alerts:
      # Requests are waiting on CPU. Rendering a page is mostly waiting on the database.
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      # Leaking. Node caps its heap at 259 MiB on this size, and reaches it, and crashes, with the
      # container near 57%, so 80% would only ever fire after the restart rule. Idle is ~10%, and
      # a maximum-size upload's spike lasts under a second, which the window averages away.
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 50
        window: TEN_MINUTES
      # Any restart: a crash, an out-of-memory kill, or a failed liveness probe.
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        # Not 0: the API reads 0 as missing and rejects the spec. There is no GREATER_THAN_OR_EQUAL.
        value: 0.5
        window: FIVE_MINUTES
      # A page is a few database round trips, so seconds means the database or the bucket is
      # slow. A slow upload trips it only when no report page is open, since each one polls every
      # 10 seconds and those fast requests keep a single slow one above the 95th percentile.
      - rule: REQUEST_DURATION_P95_MS
        operator: GREATER_THAN
        value: 5000
        window: TEN_MINUTES

    envs:
      - key: DB_CONNECTION_STRING
        type: SECRET
        value: ${DB_CONNECTION_STRING}
      - key: DB_SSL_CA
        value: ${DB_SSL_CA}

      - key: S3_ENDPOINT
        value: ${S3_ENDPOINT}
      - key: S3_REGION
        value: ${S3_REGION}
      - key: S3_ACCESS_KEY_ID
        type: SECRET
        value: ${S3_ACCESS_KEY_ID}
      - key: S3_SECRET_ACCESS_KEY
        type: SECRET
        value: ${S3_SECRET_ACCESS_KEY}
      - key: S3_BUCKET
        value: ${S3_BUCKET}

      - key: PUBLIC_AUTH_MODE
        value: placeholder
      - key: SITE_PASSWORD
        type: SECRET
        value: ${SITE_PASSWORD}
      - key: PUBLIC_SUPABASE_URL
        value: ${PUBLIC_SUPABASE_URL}
      - key: PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: ${PUBLIC_SUPABASE_PUBLISHABLE_KEY}

      - key: EMAIL_TRANSPORT
        value: provider
      - key: EMAIL_FROM_ADDRESS
        value: insights@greenerbydefault.org
      - key: EMAIL_SUPPORT_ADDRESS
        value: insights@greenerbydefault.org
      - key: EMAIL_GBD_ADDRESS
        value: insights@greenerbydefault.org
      - key: SITE_URL
        value: ${SITE_URL}

      # App Platform's proxy forwards plain HTTP. Without this, SvelteKit's CSRF check sees an
      # `http://` origin and refuses every form post.
      - key: PROTOCOL_HEADER
        value: x-forwarded-proto

ingress:
  rules:
    - component:
        name: foodservice-insights-web
      match:
        path:
          prefix: /

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
