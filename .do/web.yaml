# The web app's DigitalOcean App Platform spec. A deploy submits this whole file, and App Platform
# replaces the app's spec with it, so a setting changed in the dashboard lasts only until the next
# deploy. Change it here.
#
# Each `${NAME}` is filled in at deploy from the `production` GitHub Environment's secrets and
# variables, and an unset or empty one fails the deploy before anything is submitted. That rules out
# App Platform's own bindable variables, such as `${APP_URL}`, in this file.

name: foodservice-insights-web
# The region nearest the Supabase project: every request is a round trip to the database.
region: nyc

services:
  - name: web
    image:
      registry_type: GHCR
      registry: greenerbydefault
      repository: foodservice-insights/web
      digest: ${IMAGE_DIGEST}
    # One `apps-s-1vcpu-0.5gb` can't run a second instance. Change both counts together with
    # `WEB_INSTANCES` in `packages/db/src/budget.ts`, which `budget.test.ts` checks this against.
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    # App Platform sets `PORT` to this, and adapter-node listens on `PORT`.
    http_port: 3000

    # Readiness: an instance that can't reach the database or the bucket gets no traffic, and a
    # deploy whose instance never passes rolls back.
    health_check:
      http_path: /health/ready
    # Touches nothing, so a Supabase blip restarts nothing.
    liveness_health_check:
      http_path: /health/live

    envs:
      - key: DB_CONNECTION_STRING
        type: SECRET
        value: ${DB_CONNECTION_STRING}
      - key: DB_SSL_CA
        value: ${DB_SSL_CA}

      - key: S3_ENDPOINT
        value: ${S3_ENDPOINT}
      - key: S3_REGION
        value: ${S3_REGION}
      - key: S3_ACCESS_KEY_ID
        type: SECRET
        value: ${S3_ACCESS_KEY_ID}
      - key: S3_SECRET_ACCESS_KEY
        type: SECRET
        value: ${S3_SECRET_ACCESS_KEY}
      - key: S3_BUCKET
        value: ${S3_BUCKET}

      - key: PUBLIC_AUTH_MODE
        value: placeholder
      - key: SITE_PASSWORD
        type: SECRET
        value: ${SITE_PASSWORD}
      - key: PUBLIC_SUPABASE_URL
        value: ${PUBLIC_SUPABASE_URL}
      - key: PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: ${PUBLIC_SUPABASE_PUBLISHABLE_KEY}

      # `provider` is a stub whose every send fails with an `EmailError`, rather than going nowhere,
      # until `.claude/plans/email-provider.md` wires up Postmark.
      - key: EMAIL_TRANSPORT
        value: provider
      - key: EMAIL_FROM_ADDRESS
        value: insights@greenerbydefault.org
      - key: EMAIL_SUPPORT_ADDRESS
        value: insights@greenerbydefault.org
      # A stand-in until GBD names the address for its notices.
      - key: EMAIL_GBD_ADDRESS
        value: insights@greenerbydefault.org
      # The starter domain until `.claude/plans/cloudflare-and-domain.md` moves us to our own.
      - key: SITE_URL
        value: ${SITE_URL}

      # App Platform's proxy terminates TLS and forwards plain HTTP. Without this, adapter-node
      # takes every request for `http://`, and SvelteKit's CSRF check refuses every form post.
      - key: PROTOCOL_HEADER
        value: x-forwarded-proto

ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
