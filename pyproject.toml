# The Python workspace root. It is not a package itself; it exists to hold the uv workspace,
# one lockfile covering every member, and the tool config they all inherit.

[tool.uv.workspace]
members = ["python/*"]

# Dev tools are here for consistent versions across the repo, but runtime dependencies
# should go in projects' pyproject.toml.
[dependency-groups]
dev = [
    "nbstripout>=0.8.1",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8",
    "ruff>=0.17.0",
    "ty>=0.0.89",
]

# The only Ruff config in the repo. Ruff binds each file to the closest `pyproject.toml` that has a
# `[tool.ruff]` section, so one in a package would replace this config, lab ban included, rather
# than extend it.
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports, which enforces the lab boundary below
    "RUF", # ruff-specific
    "PTH", # flake8-use-pathlib
]
# Deliberate typography in plot labels.
allowed-confusables = ["×", "–", "ℹ"]

# The lab is where data scientists experiment without the product's constraints, so its code
# carries none of the product's guarantees: product code must not import it, while the lab may
# import anything. The same goes for test helpers. Gemini is lab-only because the product's LLM
# calls all go through `LlmClient`, which runs on OpenAI; GBD prefers Gemini for new LLM work, and
# that work starts in the lab.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"gbd_foodservice_insights_lab".msg = "Product code must not import the lab."
"gbd_foodservice_insights.testing".msg = "Product code must not import the tests."
"google.genai".msg = "Product code must not call Gemini; entree detection lives in the lab."

[tool.ruff.lint.per-file-ignores]
"python/lab/**" = ["TID251"]
"python/insights/tests/**" = ["TID251"]
"python/worker_child/tests/**" = ["TID251"]
# A package's shipped `testing.py` may import another package's `testing.py`; product
# modules may not. `gbd_foodservice_insights/testing.py` is the precedent for shipping a
# test helper in the wheel. `mock_llm.py` is `WORKER_MODE=mock-llm`'s entrypoint, which wires in
# `KeywordLlmClient` the same way.
"**/testing.py" = ["TID251"]
"python/worker_child/worker_child/mock_llm.py" = ["TID251"]

[tool.pytest.ini_options]
minversion = "9"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
testpaths = ["python"]
# `worker_child`'s tests import shared helpers from `tests/support/`, and
# `--import-mode=importlib` puts nothing on `sys.path` by itself. This makes `support`
# importable in every test session, so no other test directory may claim that name.
pythonpath = ["python/worker_child/tests"]
markers = [
    "slow: takes long enough that you would not want it in the default run",
    "llm: calls a real LLM API",
]

[tool.ty.environment]
python-version = "3.14"
